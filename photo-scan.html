<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Photo Scan</title>
  <style>
    body {
      margin: 0;
      padding: 24px 18px;
      background: #0b0b0b;
      color: white;
      font-family: Arial, sans-serif;
      text-align: center;
    }

    h1 {
      font-size: 24px;
      margin-bottom: 10px;
    }

    p {
      color: #cfcfcf;
      margin-bottom: 20px;
      font-size: 16px;
    }

    #preview {
      width: 100%;
      max-width: 420px;
      min-height: 220px;
      margin: 0 auto 20px auto;
      border-radius: 20px;
      overflow: hidden;
      border: 4px solid #ffffff;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #preview img {
      width: 100%;
      display: block;
    }

    .btn-row {
      display: flex;
      gap: 12px;
      justify-content: center;
      flex-wrap: wrap;
      margin-top: 16px;
    }

    button {
      border: none;
      border-radius: 16px;
      padding: 14px 20px;
      font-size: 16px;
      font-weight: 800;
      cursor: pointer;
      min-width: 130px;
    }

    .start-btn { background: #2196F3; color: white; }
    .back-btn { background: #999; color: white; margin-top: 18px; }
    button:disabled { opacity: .6; }

    #status {
      margin-top: 14px;
      color: #d0d0d0;
      font-size: 16px;
    }
  </style>
</head>
<body>

  <h1>📸 Photo Scan</h1>
  <p>For items with no barcode — take a clear photo of the item</p>

  <div id="preview">📷</div>

  <input type="file" accept="image/*" capture="environment" id="photoInput" style="display:none">

  <div class="btn-row">
    <button class="start-btn" id="captureBtn" onclick="document.getElementById('photoInput').click()">📷 Take Photo</button>
  </div>

  <div id="status">Tap "Take Photo" to identify an item</div>

  <button class="back-btn" onclick="goBack()">← Back</button>

  <script>
    function goBack(){
      window.location.href = "index.html";
    }

    function setStatus(text){
      document.getElementById("status").innerText = text;
    }

    document.getElementById("photoInput").addEventListener("change", async (e) => {
      const file = e.target.files[0];
      if(!file) return;

      const captureBtn = document.getElementById("captureBtn");
      captureBtn.disabled = true;

      const reader = new FileReader();

      reader.onload = async () => {
        document.getElementById("preview").innerHTML =
          '<img src="' + reader.result + '">';

        setStatus("Identifying item...");

        try {
          const res = await fetch("/api/photo-lookup", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ image: reader.result })
          });

          const data = await res.json();

          if (!res.ok || !data.success || !data.name) {
            setStatus(data.error || "Couldn't identify item — go back and enter it manually");
            captureBtn.disabled = false;
            return;
          }

          localStorage.setItem("scannedName", data.name);
          localStorage.setItem("scannedBrand", data.brand || "");
          localStorage.removeItem("scannedBarcode");
          localStorage.removeItem("amazonLink");

          setStatus("Identified: " + data.name);
          window.location.href = "index.html";
        } catch (err) {
          setStatus("Error identifying item — go back and enter it manually");
          captureBtn.disabled = false;
        }
      };

      reader.readAsDataURL(file);
    });
  </script>

</body>
</html>
