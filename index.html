<!DOCTYPE html> 
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
  
<title>1-Click Profit Finder</title>
<link rel="manifest" href="/manifest.json">

<link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png">

<link rel="apple-touch-icon" href="/icon-512.png">

<meta name="theme-color" content="#6C998A">
<style>
*{box-sizing:border-box}
body{margin:0;padding:18px;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:linear-gradient(to bottom,#EEF4F2,#DDE7E3);color:#24323D;-webkit-font-smoothing:antialiased}
.card{max-width:520px;margin:auto;background:white;border-radius:32px;padding:24px;box-shadow:0 12px 40px rgba(0,0,0,.10)}
.logoBadge{width:68px;height:68px;margin:0 auto 14px;border-radius:20px;background:linear-gradient(135deg,#36C95D,#1E7A36);display:flex;align-items:center;justify-content:center;box-shadow:0 10px 24px rgba(30,122,54,.35)}
h1{text-align:center;font-size:36px;margin:0;font-weight:800;line-height:1.1;letter-spacing:-.5px}
.sub{text-align:center;margin-top:12px;color:#5B6770;font-size:16px;font-weight:600}
.scanButton{width:100%;margin-top:28px;padding:22px;border:none;border-radius:20px;background:linear-gradient(135deg,#36C95D,#249944);color:white;font-size:19px;font-weight:800;letter-spacing:.2px;box-shadow:0 8px 24px rgba(54,201,93,.35);display:flex;align-items:center;justify-content:center;gap:10px;cursor:pointer}
.notice{margin-top:18px;padding:16px;border-radius:20px;background:#F7FAF9;color:#55796D;text-align:center;font-size:16px;font-weight:700}
.productImage{width:100%;max-height:220px;object-fit:contain;margin-top:16px;border-radius:22px;background:#F7FAF9;display:none}
label{display:block;margin-top:22px;margin-bottom:8px;font-size:14px;font-weight:700;color:#5B6770;text-transform:uppercase;letter-spacing:.3px}
input{width:100%;padding:16px 18px;border-radius:16px;border:2px solid #D8DDDF;font-size:17px;background:white;font-family:inherit}
.switch{margin-top:18px;background:#F7FAF9;border-radius:18px;padding:16px;display:flex;justify-content:space-between;align-items:center;font-weight:600}
.switch input{width:24px;height:24px}
.mainButton{width:100%;margin-top:20px;padding:19px;border:none;border-radius:20px;background:linear-gradient(135deg,#6C998A,#55796D);color:white;font-size:18px;font-weight:800;letter-spacing:.2px;cursor:pointer}
.row{display:flex;gap:10px;margin-top:14px}
.row button{flex:1;padding:16px 10px;border:none;border-radius:16px;font-size:14px;font-weight:800;letter-spacing:.2px;color:white;display:flex;align-items:center;justify-content:center;gap:6px;cursor:pointer}
.lookup{background:#009688}.amazon{background:#2196F3}.manual{background:#E91E63}.link{background:#FF9800}.save{background:#8E44AD}.clear{background:#666}.copy{background:#111}.share{background:#00A884}
.resultCard{margin-top:26px;border-radius:28px;padding:24px;display:none;color:white;animation:pop .35s ease}
@keyframes pop{from{transform:scale(.92);opacity:0}to{transform:scale(1);opacity:1}}
.resultCard h2{margin:0 0 12px 0;font-size:34px;text-align:center;letter-spacing:-.5px}
.resultCard p{margin:12px 0;font-size:19px;font-weight:700}
.buy{background:linear-gradient(135deg,#1E7A36,#34B34F);box-shadow:0 10px 28px rgba(52,179,79,.35)}
.maybe{background:linear-gradient(135deg,#D98A00,#F9B233);box-shadow:0 10px 28px rgba(249,178,51,.35)}
.skip{background:linear-gradient(135deg,#9C1F1F,#D83A3A);box-shadow:0 10px 28px rgba(216,58,58,.35)}
.saved{margin-top:28px;padding:20px;background:#F7FAF9;border-radius:24px}
.savedHeader{display:flex;justify-content:space-between;align-items:center}
.sectionTitle{font-size:22px;font-weight:800;letter-spacing:-.3px}
.savedCount{background:#24323D;color:white;padding:6px 12px;border-radius:999px;font-size:13px;font-weight:700}
.savedItem{margin-top:14px;background:white;padding:16px;border-radius:18px;border:1px solid #D8DDDF}
.savedTitle{font-weight:800;font-size:17px}
.savedVerdict{margin-top:8px;font-size:13px;font-weight:700}
.savedText{margin-top:5px;color:#5B6770;font-size:13px}
.buyText{color:#1E7A36}.maybeText{color:#D98A00}.skipText{color:#C62828}
.icon{flex-shrink:0}
</style>
</head>

<body>

<div class="card">

<div class="logoBadge">
<svg class="icon" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
<path d="M4 9V6a2 2 0 0 1 2-2h3"/>
<path d="M20 9V6a2 2 0 0 0-2-2h-3"/>
<path d="M4 15v3a2 2 0 0 0 2 2h3"/>
<path d="M20 15v3a2 2 0 0 1-2 2h-3"/>
<circle cx="12" cy="12" r="3"/>
</svg>
</div>

<h1>1-Click Profit Finder</h1>
<div class="sub">Scan products. Check profit. Save winners.</div>

<button class="scanButton" onclick="goScan()">
<svg class="icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="3" y1="4" x2="3" y2="20"/><line x1="7" y1="4" x2="7" y2="20"/><line x1="11" y1="4" x2="11" y2="20" stroke-width="3"/><line x1="15" y1="4" x2="15" y2="20"/><line x1="19" y1="4" x2="19" y2="20" stroke-width="3"/><line x1="21" y1="4" x2="21" y2="20"/></svg>
SCAN BARCODE
</button>
<button class="scanButton" style="margin-top:12px;background:linear-gradient(135deg,#2196F3,#1769AA);box-shadow:0 8px 24px rgba(33,150,243,.35)" onclick="goPhotoScan()">
<svg class="icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8a2 2 0 0 1 2-2h1.5l1-1.5h7l1 1.5H18a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2z"/><circle cx="12" cy="13" r="3.5"/></svg>
PHOTO SCAN (NO BARCODE)
</button>

<div class="notice" id="notice">Scan a product to begin</div>

<img id="productImage" class="productImage">

<label>Product</label>
<input id="productName" placeholder="Product name">

<label>Brand</label>
<input id="brandName" placeholder="Brand">

<label>Barcode</label>
<input id="barcode" placeholder="Barcode">

<label>Shop Buy Price (£)</label>
<input id="buy" type="number" step="0.01" placeholder="Shelf / clearance price">

<label>Amazon Sell Price (£)</label>
<input id="amazon" type="number" step="0.01" placeholder="Enter Amazon price">

<div class="switch">
<span>Include VAT estimate (20%)</span>
<input id="vatToggle" type="checkbox">
</div>

<button class="mainButton" onclick="calculate()">
<svg class="icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:inline;vertical-align:-3px;margin-right:6px"><circle cx="12" cy="12" r="9"/><path d="M12 7v10M9.5 9.5c0-1.4 1.2-2.2 2.5-2.2s2.5.9 2.5 2c0 1.6-2 1.7-2.5 2.7-.2.4-.2 1-.2 1.5M9.5 15.5c0 1.3 1.2 2 2.5 2s2.5-.7 2.5-2"/></svg>
CHECK PROFIT
</button>

<div class="row">
<button class="lookup" onclick="lookupProduct()">
<svg class="icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="6"/><line x1="20" y1="20" x2="15.5" y2="15.5"/></svg>
LOOKUP
</button>
<button class="amazon" onclick="openAmazon()">
<svg class="icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="20" r="1"/><circle cx="18" cy="20" r="1"/><path d="M2 3h2l2.4 12.2a2 2 0 0 0 2 1.6h8.4a2 2 0 0 0 2-1.6L21 7H6"/></svg>
AMAZON
</button>
</div>

<div class="row">
<button class="link" onclick="pasteAmazonLink()">
<svg class="icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 15l6-6"/><path d="M11 6l1-1a3.5 3.5 0 0 1 5 5l-1 1"/><path d="M13 18l-1 1a3.5 3.5 0 0 1-5-5l1-1"/></svg>
LINK
</button>
<button class="manual" onclick="manualLookup()">
<svg class="icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>
MANUAL
</button>
</div>

<div class="row">
<button class="copy" onclick="copyAffiliateLink()">
<svg class="icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></svg>
COPY
</button>
<button class="share" onclick="shareDeal()">
<svg class="icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="5" r="2.5"/><circle cx="6" cy="12" r="2.5"/><circle cx="18" cy="19" r="2.5"/><line x1="8.2" y1="10.7" x2="15.8" y2="6.3"/><line x1="8.2" y1="13.3" x2="15.8" y2="17.7"/></svg>
SHARE
</button>
</div>

<div id="resultCard" class="resultCard">
<h2 id="resultTitle">RESULT</h2>
<p id="profitText"></p>
<p id="roiText"></p>
<p id="feeText"></p>
<p id="vatText"></p>
<p id="verdictText"></p>
</div>

<div class="row">
<button class="save" onclick="saveScan()">
<svg class="icon" width="16" height="16" viewBox="0 0 24 24" fill="currentColor" stroke="none"><polygon points="12,2 15,9 22,9.3 16.5,14 18.5,21 12,17 5.5,21 7.5,14 2,9.3 9,9"/></svg>
SAVE
</button>
<button class="clear" onclick="clearAll()">
<svg class="icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3,6 5,6 21,6"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/></svg>
CLEAR
</button>
</div>

<div class="saved">
<div class="savedHeader">
<div class="sectionTitle">Saved Products</div>
<div id="savedCount" class="savedCount">0</div>
</div>
<div id="savedList">No saved products yet.</div>
</div>

</div>

<script>
const AFFILIATE_TAG="nextgencreati-20";

function goScan(){
  window.location.href="barcode-scanner.html";
}

function goPhotoScan(){
  window.location.href="photo-scan.html";
}

function setNotice(text){
  document.getElementById("notice").innerText=text;
}

function clean(v){
  return (v || "").toString().trim();
}

function buildAmazonSearchUrl(){
  const savedLink=localStorage.getItem("amazonLink");
  if(savedLink) return savedLink;

  const product=clean(document.getElementById("productName").value);
  const brand=clean(document.getElementById("brandName").value);
  const barcode=clean(document.getElementById("barcode").value);

  const search=[brand,product].filter(Boolean).join(" ") || barcode;

  if(!search) return "";

  const url="https://www.amazon.co.uk/s?k="+encodeURIComponent(search)+"&tag="+encodeURIComponent(AFFILIATE_TAG);
  localStorage.setItem("amazonLink",url);
  return url;
}

async function lookupProduct(){
  const barcode=clean(document.getElementById("barcode").value);
  const product=clean(document.getElementById("productName").value);
  const brand=clean(document.getElementById("brandName").value);

  if(!barcode && !product){
    alert("Scan or enter a product first");
    return;
  }

  setNotice("Looking up product...");

  const url=barcode
    ? "/api/product-search?barcode="+encodeURIComponent(barcode)
    : "/api/product-search?query="+encodeURIComponent(product);

  try{
    const res=await fetch(url);
    const data=await res.json();

    if(!data.success){
      setNotice("Product lookup failed");
      return;
    }

    const finalBrand=data.brand || brand;

    document.getElementById("productName").value=data.productName || product || barcode;
    document.getElementById("brandName").value=finalBrand;
    document.getElementById("barcode").value=data.barcode || barcode;

    if(data.image){
      const img=document.getElementById("productImage");
      img.src=data.image;
      img.style.display="block";
    }

    const search=[finalBrand,data.productName].filter(Boolean).join(" ") || barcode || product;
    const amazonUrl="https://www.amazon.co.uk/s?k="+encodeURIComponent(search)+"&tag="+encodeURIComponent(AFFILIATE_TAG);
    localStorage.setItem("amazonLink",amazonUrl);

    setNotice("Product found — checking Amazon price...");
    await lookupAmazonPrice(search);
  }catch(e){
    setNotice("Lookup error — try Amazon/manual");
  }
}

async function lookupAmazonPrice(search){
  try{
    const res=await fetch("/api/amazon-price?query="+encodeURIComponent(search));
    const data=await res.json();

    if(data.success && typeof data.price==="number"){
      document.getElementById("amazon").value=data.price.toFixed(2);
      setNotice("Amazon price found — enter shop price and check profit");
    }else{
      setNotice("Product found — enter Amazon price manually");
    }
  }catch(e){
    setNotice("Product found — enter Amazon price manually");
  }
}

function calculate(){
  const buy=parseFloat(document.getElementById("buy").value);
  const amazon=parseFloat(document.getElementById("amazon").value);
  const vatOn=document.getElementById("vatToggle").checked;

  if(isNaN(buy)||isNaN(amazon)||buy<=0||amazon<=0){
    alert("Enter buy price and Amazon sell price first");
    return;
  }

  const fee=amazon*0.15;
  const vat=vatOn ? amazon*0.20 : 0;
  const profit=amazon-fee-vat-buy;
  const roi=(profit/buy)*100;

  const card=document.getElementById("resultCard");
  const title=document.getElementById("resultTitle");
  let verdictClass="";

  if(profit>5 && roi>40){
    card.className="resultCard buy";
    title.innerText="🔥 WINNER";
    document.getElementById("verdictText").innerText="⭐ Excellent reseller opportunity";
    verdictClass="buyText";
  }else if(profit>0){
    card.className="resultCard maybe";
    title.innerText="⚠️ MAYBE";
    document.getElementById("verdictText").innerText="⭐ Worth checking competition";
    verdictClass="maybeText";
  }else{
    card.className="resultCard skip";
    title.innerText="❌ SKIP";
    document.getElementById("verdictText").innerText="⭐ Profit too low after fees";
    verdictClass="skipText";
  }

  document.getElementById("profitText").innerHTML="💰 Profit: <strong>£"+profit.toFixed(2)+"</strong>";
  document.getElementById("roiText").innerHTML="📈 ROI: <strong>"+roi.toFixed(1)+"%</strong>";
  document.getElementById("feeText").innerHTML="🏷 Amazon Fee: £"+fee.toFixed(2);
  document.getElementById("vatText").innerHTML=vatOn ? "🧾 VAT Estimate: £"+vat.toFixed(2) : "🧾 VAT Estimate: OFF";
  document.getElementById("verdictText").className=verdictClass;

  card.style.display="block";
  setNotice("Profit checked — save this find if it looks good");
  navigator.vibrate?.(200);
}

function openAmazon(){
  const url=buildAmazonSearchUrl();

  if(!url){
    alert("Scan or enter product first");
    return;
  }

  window.open(url,"_blank");
}

function pasteAmazonLink(){
  const link=prompt("Paste Amazon product link");
  if(!link)return;

  const tagged=link.includes("tag=")
    ? link
    : link+(link.includes("?") ? "&" : "?")+"tag="+encodeURIComponent(AFFILIATE_TAG);

  localStorage.setItem("amazonLink",tagged);
  setNotice("Amazon link saved with tracking ID");
}

function manualLookup(){
  const name=prompt("Enter product name",document.getElementById("productName").value);
  if(name) document.getElementById("productName").value=name;

  const brand=prompt("Enter brand",document.getElementById("brandName").value);
  if(brand) document.getElementById("brandName").value=brand;

  lookupProduct();
}

async function copyAffiliateLink(){
  const url=buildAmazonSearchUrl();

  if(!url){
    alert("No Amazon link yet");
    return;
  }

  try{
    await navigator.clipboard.writeText(url);
    setNotice("Affiliate link copied");
  }catch(e){
    prompt("Copy this affiliate link",url);
  }
}

async function shareDeal(){
  const url=buildAmazonSearchUrl();

  if(!url){
    alert("No Amazon link yet");
    return;
  }

  const product=clean(document.getElementById("productName").value) || "Amazon find";
  const brand=clean(document.getElementById("brandName").value);
  const title=[brand,product].filter(Boolean).join(" ");

  const text="Found this: "+title+" "+url;

  if(navigator.share){
    try{
      await navigator.share({title:"1-Click Profit Finder",text,url});
      setNotice("Deal shared");
      return;
    }catch(e){}
  }

  try{
    await navigator.clipboard.writeText(text);
    setNotice("Share text copied");
  }catch(e){
    prompt("Copy this share text",text);
  }
}

function saveScan(){
  const saved=JSON.parse(localStorage.getItem("savedProducts") || "[]");

  saved.unshift({
    product:document.getElementById("productName").value || "Unknown Product",
    brand:document.getElementById("brandName").value || "",
    buy:document.getElementById("buy").value || "Not set",
    sell:document.getElementById("amazon").value || "Not set",
    barcode:document.getElementById("barcode").value || "None",
    profit:document.getElementById("profitText").innerText || "",
    roi:document.getElementById("roiText").innerText || "",
    verdict:document.getElementById("resultTitle").innerText || "",
    link:buildAmazonSearchUrl(),
    date:new Date().toLocaleString()
  });

  localStorage.setItem("savedProducts",JSON.stringify(saved.slice(0,50)));
  renderSaved();
  setNotice("Saved");
  navigator.vibrate?.([100,50,100]);
}

function renderSaved(){
  const box=document.getElementById("savedList");
  const saved=JSON.parse(localStorage.getItem("savedProducts") || "[]");

  document.getElementById("savedCount").innerText=saved.length;

  if(!saved.length){
    box.innerHTML="No saved products yet.";
    return;
  }

  box.innerHTML=saved.map(item=>{
    let cls="skipText";
    if((item.verdict||"").includes("WINNER")) cls="buyText";
    else if((item.verdict||"").includes("MAYBE")) cls="maybeText";

    return `
      <div class="savedItem">
        <div class="savedTitle">${[item.brand,item.product].filter(Boolean).join(" ")}</div>
        <div class="savedVerdict ${cls}">${item.verdict || "Saved"}</div>
        <div class="savedText">${item.profit || ""} ${item.roi ? "· "+item.roi : ""}</div>
        <div class="savedText">Buy: £${item.buy} · Sell: £${item.sell}</div>
        <div class="savedText">Barcode: ${item.barcode}</div>
        <div class="savedText">Saved: ${item.date}</div>
      </div>
    `;
  }).join("");
}

function clearAll(){
  document.getElementById("productName").value="";
  document.getElementById("brandName").value="";
  document.getElementById("barcode").value="";
  document.getElementById("buy").value="";
  document.getElementById("amazon").value="";
  document.getElementById("resultCard").style.display="none";
  document.getElementById("productImage").style.display="none";

  localStorage.removeItem("scannedBarcode");
  localStorage.removeItem("scannedName");
  localStorage.removeItem("scannedBrand");
  localStorage.removeItem("amazonLink");

  setNotice("Scan a product to begin");
}

window.onload=async ()=>{
  if("serviceWorker" in navigator){
    navigator.serviceWorker.register("/service-worker.js").catch(()=>{});
  }

  renderSaved();

  const barcode=localStorage.getItem("scannedBarcode") || "";
  const name=localStorage.getItem("scannedName") || "";
  const brand=localStorage.getItem("scannedBrand") || "";

  document.getElementById("barcode").value=barcode;
  document.getElementById("productName").value=name;
  document.getElementById("brandName").value=brand;

  if(barcode || name){
    await lookupProduct();
  }
}
</script>

</body>
</html>
